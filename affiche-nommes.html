<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Agent de l'année 2026 – Les nommés</title>
<style>
  :root { --noir: #0c0b09; --ombre: #1b1812; --or: #d9b45b; --blanc: #f4efe4; --filet: #3a3323; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--noir); }
  main {
    position: relative;
    width: 1080px; height: 1350px;
    padding: 84px 76px 76px;
    display: flex; flex-direction: column;
    background: var(--noir);
    color: var(--blanc);
  }
  .silhouette {
    position: absolute; right: -150px; bottom: 0;
    width: 800px; height: 936px;
    fill: var(--ombre);
  }
  header, ul, footer { position: relative; }
  .nommes {
    font: 600 27px/1 "Avenir Next", sans-serif;
    letter-spacing: .3em;
    color: var(--or);
  }
  h1 {
    margin-top: 20px;
    font: 400 112px/1 "Didot", serif;
    white-space: nowrap;
  }
  ul { list-style: none; flex: 1; margin-top: 56px; display: flex; flex-direction: column; }
  li {
    flex: 1;
    width: 620px;
    display: flex; align-items: center;
    border-top: 1px solid var(--filet);
    font: 400 52px/1 "Didot", serif;
  }
  li:last-child { border-bottom: 1px solid var(--filet); }
  footer {
    margin-top: 40px;
    font: 600 27px/1 "Avenir Next", sans-serif;
    letter-spacing: .3em;
    color: var(--or);
  }
  footer a {
    display: block;
    margin-top: 16px;
    font: 500 34px/1 "Avenir Next", sans-serif;
    letter-spacing: 0;
    color: var(--blanc);
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">

    <path d="M71 80h58c1 8 1 18-1 27-3 17-14 30-28 30s-25-13-28-30c-2-9-2-19-1-27z"/>

</body>
</html>
