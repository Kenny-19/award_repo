<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prix spéciaux – Agent de l'année</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&family=Jost:wght@400;500;600&display=swap">
<style>
  :root {
    --noir: #0c0b09; --ombre: #1b1812; --filet: #3a3323; --or: #d9b45b; --blanc: #f4efe4; --doux: #b5ad9b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  body {
    background: var(--noir); color: var(--blanc); font: 400 18px/1.45 "Jost", "Avenir Next", sans-serif;
    padding-block: 44px 40px;
    padding-left: max(20px, env(safe-area-inset-left, 0px));
    padding-right: max(20px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .label { font-size: 14px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--or); }
  h1 { font: 400 clamp(38px, 10vw, 56px)/1.05 "Bodoni Moda", Didot, serif; }
  form, #bulletin, #prix { display: flex; flex-direction: column; gap: 16px; }
  label { display: flex; flex-direction: column; gap: 6px; font: 400 24px/1.2 "Bodoni Moda", Didot, serif; }
  input, select {
    width: 100%; min-height: 54px; padding: 10px 12px;
    background: var(--ombre); color: var(--blanc); border: 1px solid var(--filet);
    font: 400 18px/1.2 "Jost", "Avenir Next", sans-serif;
  }
  button {
    min-height: 56px; padding: 12px; background: var(--or); color: var(--noir); border: 0; cursor: pointer;
    font: 600 18px/1.2 "Jost", "Avenir Next", sans-serif;
  }
  button:disabled { background: var(--ombre); color: var(--doux); cursor: default; }
  :focus-visible { outline: 3px solid var(--or); outline-offset: 2px; }
  a { color: var(--or); }
</style>
</head>
<body>
<main>
  <p class="label">Réservé aux 8 agents</p>
  <h1>Les prix spéciaux</h1>

  <form id="entree">
    <label for="code">Ton code personnel
      <input id="code" autocomplete="off" autocapitalize="characters" required>
    </label>
    <button>Ouvrir mon bulletin</button>
  </form>

  <form id="bulletin" hidden>
    <p id="bonjour"></p>
    <div id="prix"></div>
    <button id="envoyer">Envoyer mon bulletin</button>
  </form>

  <p id="message" role="status"></p>
  <a href="/">Retour à l'accueil</a>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let code = "";
  let infos = null;

  async function appel(chemin, corps) {
    const reponse = await fetch(chemin, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(corps),
    });
    return { ok: reponse.ok, donnees: await reponse.json() };
  }

  $("entree").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("message").textContent = "Vérification...";
    code = $("code").value;
    try {
      const { ok, donnees } = await appel("/api/groupe/verifier", { code });
      if (!ok) { $("message").textContent = donnees.erreur; return; }
      infos = donnees;
      $("entree").hidden = true;
      if (donnees.ferme) { $("message").textContent = "Le vote est terminé."; return; }
      if (donnees.deja) { $("message").textContent = `${donnees.agent.nom}, ton bulletin est déjà enregistré.`; return; }
      $("message").textContent = "";
      $("bonjour").textContent = `Bulletin de ${donnees.agent.nom}. Une personne par prix. Tu ne peux voter pour toi qu'à la Mission Échouée.`;
      for (const p of donnees.prix) {
        const select = document.createElement("select");
        select.id = "prix-" + p.id;
        select.required = true;
        select.append(new Option("Choisir un agent", ""));
        for (const a of donnees.agents) {
          if (a.numero === donnees.agent.numero && !p.autoVote) continue;
          select.append(new Option(a.nom, a.numero));
        }
        const label = document.createElement("label");
        label.htmlFor = select.id;
        label.append(p.nom, select);
        $("prix").append(label);
      }
      $("bulletin").hidden = false;
    } catch {
      $("message").textContent = "Connexion impossible. Réessaie.";
    }
  });

  $("bulletin").addEventListener("submit", async (e) => {
    e.preventDefault();
    const choix = {};
    for (const p of infos.prix) choix[p.id] = Number($("prix-" + p.id).value);
    $("envoyer").disabled = true;
    $("message").textContent = "Envoi...";
    try {
      const { ok, donnees } = await appel("/api/groupe/vote", { code, choix });
      if (ok) {
        $("bulletin").hidden = true;
        $("message").textContent = "Bulletin enregistré. Rendez-vous le vendredi 6 novembre 2026.";
        return;
      }
      $("message").textContent = donnees.erreur;
    } catch {
      $("message").textContent = "Le bulletin n'est pas parti. Réessaie.";
    }
    $("envoyer").disabled = false;
  });
</script>
</body>
</html>
